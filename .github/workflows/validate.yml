name: Validate Notebooks

on:
  push:
    paths:
      - 'notebooks/*.ipynb'
  pull_request:
    paths:
      - 'notebooks/*.ipynb'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate notebook JSON
        run: python scripts/validate_notebooks.py
